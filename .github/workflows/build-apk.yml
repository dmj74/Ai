name: Build Android APK

on:
  push:
    branches: [arena/01a0ca1e-ai]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: |
          chmod +x gradlew
          ./gradlew --version
      - uses: android-actions/setup-android@v4
      - run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - run: |
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
          exit ${PIPESTATUS[0]}
      - if: always()
        run: |
          rm -rf /tmp/logrepo && mkdir -p /tmp/logrepo && cd /tmp/logrepo
          git init -q
          git config user.email ci@titanali
          git config user.name titanali-ci
          tail -c 2000000 /tmp/build.log > build.log
          [ -f "$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk" ] && cp "$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk" titanali.apk || true
          git add -A
          git commit -q -m "build-$(date +%s)"
          git branch -M main
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/dmj74/Ai.git"
          git push -f origin main:build-logs 2>&1 || true          git branch -M main
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/dmj74/Ai.git"
          git push -f origin main:build-logs 2>&1 || true
